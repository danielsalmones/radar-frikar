name: radar-kleinanzeigen

on:
  schedule:
    - cron: "17 * * * *"      # horario, minuto no redondo (UTC)
    - cron: "47 * * * *"      # refuerzo: GitHub retrasa/tira crons bajo carga
  workflow_dispatch:
    inputs:
      force_heartbeat:
        description: "Forzar el latido semanal (📋) en esta ejecución"
        type: boolean
        default: false

# no solapar ejecuciones: se encolan, nunca se cancela una en curso
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip           # caché de pip: matplotlib no se reinstala cada vez

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_FAST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RADAR_FORCE_HEARTBEAT: ${{ github.event.inputs.force_heartbeat == 'true' && '1' || '0' }}
        run: python src/radar.py

      - name: Commit y push (state + informes)
        run: |
          git config user.name  "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            MSG=$(cat /tmp/radar_commit_msg 2>/dev/null || echo "radar: actualización automática")
            git commit -m "$MSG"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || echo "⚠️ push falló — revisa conflictos"
          else
            echo "Sin cambios que commitear."
          fi
